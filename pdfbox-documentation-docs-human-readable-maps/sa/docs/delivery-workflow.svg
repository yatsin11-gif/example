pace">→ qa/test-matrix.yaml (coverage)</text><text x="512" y="628" font-size="11" fill="#0f766e" text-anchor="start" font-weight="bold">✔ QA валидирует</text><line x1="640" y1="640" x2="640" y2="660" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arg)"/><rect x="460" y="660" width="360" height="104" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><circle cx="488" cy="688" r="15" fill="#64748b"/><text x="488" y="693" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">5.5</text><text x="512" y="684" font-size="13" fill="#1e293b" text-anchor="start" font-weight="bold">ЭТАП 5.5 — QASE SYNC (CI)</text><text x="512" y="703" font-size="11" fill="#475569" text-anchor="start" font-weight="bold">CI: scripts/qase-sync.js</text><text x="512" y="720" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, monospace">manual job sync_qase @ main</text><text x="512" y="735" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, monospace">create/update Qase suites+cases</text><path d="M220 764 L220 794 L600 794" stroke="#4f46e5" stroke-width="2" fill="none"/><path d="M640 764 L640 794 L600 794" stroke="#4f46e5" stroke-width="2" fill="none"/><line x1="600" y1="794" x2="600" y2="818" stroke="#4f46e5" stroke-width="2" marker-end="url(#ar)"/><text x="600" y="786" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="italic">Jira issue + reviewed QA cases → реализация</text><rect x="400" y="820" width="400" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="430" cy="850" r="16" fill="#4f46e5"/><text x="430" y="855" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="458" y="846" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">ЭТАП 6 — EXECPLAN + РЕАЛИЗАЦИЯ</text><text x="458" y="866" font-size="12" fill="#4f46e5" text-anchor="start" font-weight="bold">skill: dev-jira-plan</text><text x="458" y="886" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, monospace">→ &lt;target-repo&gt;/.agent/plans/*.md, затем код</text><text x="458" y="908" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">на каждый репозиторий — отдельный план</text><rect x="60" y="850" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="210" y="870" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="bold">✔ CHECKPOINT</text><text x="210" y="890" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">DEV ведёт план</text><line x1="360" y1="880" x2="400" y2="880" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="600" y1="940" x2="600" y2="964" stroke="#4f46e5" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="966" width="400" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="600" y="990" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="bold">ЦЕЛЕВЫЕ РЕПОЗИТОРИИ (реализация)</text><text x="600" y="1010" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, monospace">pdf.box-app · pdf.box-landing</text><text x="600" y="1026" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, monospace">pdf.box-admin · pdfbox-backend</text></svg>