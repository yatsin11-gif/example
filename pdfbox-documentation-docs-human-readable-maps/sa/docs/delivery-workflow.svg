chor="middle" font-weight="normal">notes · ссылки · скриншоты · тикеты</text><line x1="600" y1="176" x2="600" y2="200" stroke="#4f46e5" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="202" width="400" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="430" cy="232" r="16" fill="#4f46e5"/><text x="430" y="237" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="458" y="228" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">ЭТАП 1 — FEATURE SPEC</text><text x="458" y="248" font-size="12" fill="#4f46e5" text-anchor="start" font-weight="bold">skill: sa-feature-spec</text><text x="458" y="268" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, monospace">→ requirements/feature-spec.md</text><text x="458" y="290" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">нормализует постановку; не придумывает логику</text><rect x="60" y="232" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="210" y="252" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="bold">✔ CHECKPOINT</text><text x="210" y="272" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">SA утверждает spec</text><line x1="360" y1="262" x2="400" y2="262" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="600" y1="322" x2="600" y2="344" stroke="#4f46e5" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="344" width="400" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="430" cy="374" r="16" fill="#4f46e5"/><text x="430" y="379" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="458" y="370" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">ЭТАП 2 — CRITERIA</text><text x="458" y="390" font-size="12" fill="#4f46e5" text-anchor="start" font-weight="bold">skill: sa-requirements-criteria</text><text x="458" y="410" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, monospace">→ requirements/feature-criteria.md</text><text x="458" y="432" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" font-style="italic">functional + non-functional; нового поведения нет</text><rect x="60" y="374" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="210" y="394" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="bold">✔ CHECKPOINT</text><text x="210" y="414" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">SA валидирует criteria</text><line x1="360" y1="404" x2="400" y2="404" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="600" y1="464" x2="600" y2="486" stroke="#4f46e5" stroke-width="2" marker-end="url(#ar)"/><text x="600" y="490" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" font-style="italic">criteria → два параллельных трека</text><path d="M600 494 L600 512" stroke="#4f46e5" stroke-width="2" fill="none"/><path d="M600 512 L240 512 L240 534" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M600 512 L640 512 L640 534" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="40" y="536" width="360" height="104" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><circle cx="68" cy="564" r="15" fill="#4f46e5"/><text x="68" y="569" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="92" y="560" font-size="13" fill="#1e293b" text-anchor="start" font-weight="bold">ЭТАП 3 — DECOMPOSITION</text><text x="92" y="579" font-size="11" fill="#4f46e5" text-anchor="start" font-weight="bold">skill: sa-jira-decomposition</text><text x="92" y="596" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, monospace">→ tasks/